<svg width="580" height="220" viewBox="0 0 580 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="580" height="220" fill="#0B0E13" stroke="#1A222B" stroke-width="1"/>
  <g stroke="#F5A623" stroke-width="1.5" fill="none">
    <path d="M12 12 L12 28 M12 12 L28 12"/>
    <path d="M568 12 L568 28 M568 12 L552 12"/>
  </g>
  <text x="20" y="34" font-family="'Courier New', monospace" font-size="10" fill="#5B6572" letter-spacing="1">PROJECT.01</text>
  <text x="20" y="58" font-family="'Courier New', monospace" font-weight="bold" font-size="20" fill="#E6EDF3">SchemaSense</text>
  <text x="20" y="80" font-family="'Courier New', monospace" font-size="11" fill="#8B96A3">NL-to-SQL, self-correcting on failure</text>

  <!-- retry loop diagram -->
  <g font-family="'Courier New', monospace" font-size="9" fill="#C9D1D9">
    <rect x="20" y="100" width="80" height="28" rx="2" fill="none" stroke="#3E4C5A"/>
    <text x="60" y="118" text-anchor="middle">NL QUERY</text>

    <rect x="140" y="100" width="80" height="28" rx="2" fill="none" stroke="#F5A623"/>
    <text x="180" y="118" text-anchor="middle" fill="#F5A623">SQL GEN</text>

    <rect x="260" y="100" width="90" height="28" rx="2" fill="none" stroke="#3E4C5A"/>
    <text x="305" y="118" text-anchor="middle">SAFETY CHECK</text>

    <rect x="390" y="100" width="80" height="28" rx="2" fill="none" stroke="#3E4C5A"/>
    <text x="430" y="118" text-anchor="middle">EXECUTE</text>

    <path d="M100 114 L140 114" stroke="#2C3844"/>
    <path d="M220 114 L260 114" stroke="#2C3844"/>
    <path d="M350 114 L390 114" stroke="#2C3844"/>

    <path d="M305 128 C305 155, 180 155, 180 128" stroke="#F5A623" stroke-dasharray="3,3" fill="none" marker-end="url(#arrow)"/>
    <text x="242" y="150" text-anchor="middle" fill="#F5A623" font-size="8">retry ≤3x on fail</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#F5A623"/>
    </marker>
  </defs>

  <line x1="20" y1="165" x2="560" y2="165" stroke="#1A222B"/>
  <text x="20" y="185" font-family="'Courier New', monospace" font-size="10" fill="#5B6572">FastAPI · LangChain · PostgreSQL · Redis · gpt-4o-mini</text>
  <text x="20" y="203" font-family="'Courier New', monospace" font-size="10" fill="#3E4C5A">Two-layer safety: regex filter + SELECT-only DB role</text>
</svg>
